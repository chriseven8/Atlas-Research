name: atlas-research
x-backend: &backend
  build:
    context: .
    dockerfile: infra/backend.Dockerfile
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://research:research@postgres:5432/research
    EMBED_WORKER: "false"
    ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_MODEL: ${OPENAI_MODEL:-}
    OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    # 默认值与 settings.py 保持一致：容器 env 会覆盖代码默认值，漏改会让多 Agent 跑不动。
    MAX_LLM_OUTPUT_TOKENS: ${MAX_LLM_OUTPUT_TOKENS:-4000}
    MAX_LLM_CALLS: ${MAX_LLM_CALLS:-12}
    TASK_TIMEOUT_SECONDS: ${TASK_TIMEOUT_SECONDS:-240}
    LLM_INPUT_PRICE_PER_MILLION: ${LLM_INPUT_PRICE_PER_MILLION:-}
    LLM_OUTPUT_PRICE_PER_MILLION: ${LLM_OUTPUT_PRICE_PER_MILLION:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: research
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research"]
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    <<: *backend
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *backend
    ports: ["127.0.0.1:8877:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  worker:
    <<: *backend
    command: ["python", "-m", "financial_research.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
